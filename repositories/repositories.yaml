apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-backend
  labels:
    factory.ai-dlc.io/language: go
spec:
  git:
    url: https://github.com/acme/shop-backend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true            # code search / embeddings for code-researcher
    refreshOn: [push]
    include: ["**/*.go", "**/*.md", "api/**/*.yaml"]
    exclude: ["vendor/**"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: shop-core }]
  observability:             # lets the SRE/code-researcher map runtime errors → code
    service: shop-backend
    logs: { provider: loki, selector: '{app="shop-backend"}' }
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-frontend
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  git:
    url: https://github.com/acme/shop-frontend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true
    refreshOn: [push]
    include: ["src/**"]
  context:
    docs: [README.md]
    owners: [{ role: tech-lead, team: shop-web }]
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: software-factory
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  local:
    path: .                  # relative to the factory root (MVP: local checkouts only, ADR-0008)
  git:                       # ADR-0023: branches are pushed here and draft PRs opened
    url: https://github.com/ron96g/software-factory.git
    defaultBranch: master
    secretRef: { name: github-token }
  index:
    enabled: true
    type: ripgrep
    include: ["web/src/**", "agents/**", "skills/**", "workflows/**", "docs/**", "*.md"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: platform }]
  sandboxRef: { name: node-build }
  checks:                    # ADR-0023: commands for the automated gate, run in the workspace
    build: cd web && npx tsc --noEmit -p .
    unit-tests: cd web && npm test --silent
  workspace:                 # ADR-0021: runs once in a fresh workspace (host: git worktree)
    setup:
      - cd web && npm ci --no-audit --no-fund --loglevel=error
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: controlplane
  labels:
    factory.ai-dlc.io/language: go
  annotations:
    description: Telekom Controlplane (TARDIS) Go monorepo, https://github.com/telekom/controlplane
spec:
  local:
    # Dedicated clone for the factory (it adds git worktrees and factory/* branches there), outside the factory root.
    path: ~/git/personal/software-factory-repos/controlplane
  # No `git:` on purpose: without it the factory never pushes branches or opens PRs on the public
  # telekom/controlplane repository (ADR-0023). Add `git: { url, defaultBranch: main, secretRef }` to enable that.
  index:
    enabled: true
    type: ripgrep
    include: ["**/*.go", "**/*.md", "**/*.mdx", "**/*.yaml", "**/Makefile"]
    exclude: ["**/zz_generated*.go", "**/node_modules/**", "docs/static/**"]
  context:
    docs: [AGENTS.md, README.md]
  sandboxRef: { name: go-build }
  checks:                    # The repo's AGENTS.md: always use the Makefile targets. Checks time out after 15 min.
    build: make build-all
    unit-tests: make test-all
