apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-backend
  labels:
    factory.ai-dlc.io/language: go
spec:
  git:
    url: https://github.com/acme/shop-backend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true            # code search / embeddings for code-researcher
    refreshOn: [push]
    include: ["**/*.go", "**/*.md", "api/**/*.yaml"]
    exclude: ["vendor/**"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: shop-core }]
  observability:             # lets the SRE/code-researcher map runtime errors → code
    service: shop-backend
    logs: { provider: loki, selector: '{app="shop-backend"}' }
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-frontend
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  git:
    url: https://github.com/acme/shop-frontend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true
    refreshOn: [push]
    include: ["src/**"]
  context:
    docs: [README.md]
    owners: [{ role: tech-lead, team: shop-web }]
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: software-factory
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  local:
    path: .                  # relative to the factory root (MVP: local checkouts only, ADR-0008)
  git:                       # ADR-0023: branches are pushed here and draft PRs opened
    url: https://github.com/ron96g/software-factory.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true
    type: ripgrep
    include: ["web/src/**", "agents/**", "skills/**", "workflows/**", "docs/**", "*.md"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: platform }]
  sandboxRef: { name: node-build }
  checks:                    # ADR-0023: commands for the automated gate, run in the workspace
    build: cd web && npx tsc --noEmit -p .
    # ADR-0086: TAP names every failed test; `rerunFailed` runs only those again (from the workspace root, names via env only).
    unit-tests:
      command: cd web && node --test --test-reporter=tap "src/**/*.test.ts"
      resultFormat: node-test-tap
      rerunFailed: node --test --test-reporter=tap --test-name-pattern="$FACTORY_RERUN_PATTERN" $FACTORY_RERUN_FILES
    integration-tests:                                                   # composition-root suites (real store, controllers, definitions)
      command: cd web && node --test --test-reporter=tap src/core/factory.test.ts src/core/planning-factory.test.ts src/core/checks-pr.test.ts src/core/v02.test.ts
      resultFormat: node-test-tap
      rerunFailed: node --test --test-reporter=tap --test-name-pattern="$FACTORY_RERUN_PATTERN" $FACTORY_RERUN_FILES
    acceptance-criteria:                                                 # web/src/acceptance/*.acceptance.test.ts; fails when empty
      command: cd web && ls src/acceptance/*.acceptance.test.ts >/dev/null && node --test --test-reporter=tap "src/acceptance/*.acceptance.test.ts"
      resultFormat: node-test-tap
      rerunFailed: node --test --test-reporter=tap --test-name-pattern="$FACTORY_RERUN_PATTERN" $FACTORY_RERUN_FILES
    security-scan: { command: "cd web && npm audit --omit=dev --audit-level=high --json", resultFormat: npm-audit-json }
    preflight: node --version && npm --version && test -d web/node_modules
  verification:
    requiredChecks: [build, unit-tests, integration-tests, acceptance-criteria, security-scan]
    preflightChecks: [preflight]
    waivableChecks: [integration-tests, acceptance-criteria, security-scan]
    autoWaive:               # ADR-0067: pre-existing advisories on the base commit are waived by policy
      - { check: security-scan, when: pre-existing, followUp: finding }
    readinessChecks: [build, unit-tests]   # ADR-0047: per-Unit construction readiness, never final verification
  workspace:                 # ADR-0021: runs once in a fresh workspace (host: git worktree)
    baseRef: origin/main      # base each item on the current upstream main (the publish target), not the checkout's HEAD
    setup:
      - cd web && npm ci --no-audit --no-fund --loglevel=error
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: controlplane
  labels:
    factory.ai-dlc.io/language: go
  annotations:
    description: Telekom Controlplane (TARDIS) Go monorepo, https://github.com/telekom/controlplane
spec:
  local:
    # Dedicated clone for the factory (it adds git worktrees and factory/* branches there), outside the factory root.
    path: ~/git/personal/software-factory-repos/controlplane
  # ADR-0023: when an item enters its publish stage (after verification), its factory/* branch is pushed to the
  # public repository and a draft PR is opened.
  git:
    url: https://github.com/telekom/controlplane.git
    defaultBranch: main
    secretRef: { name: github-token }
    # ADR-0092: the publication commit runs the repository's pre-commit hooks (conventional-pre-commit, reuse-lint-file,
    # gitleaks) inside the sandbox, with a Conventional Commits message.
    commit:
      hooks: pre-commit
      convention: conventional
  index:
    enabled: true
    type: ripgrep
    include: ["**/*.go", "**/*.md", "**/*.mdx", "**/*.yaml", "**/Makefile"]
    exclude: ["**/zz_generated*.go", "**/node_modules/**", "docs/static/**"]
  context:
    docs: [AGENTS.md, README.md]
  sandboxRef: { name: go-build }
  # ADR-0095 §7: generated files without a `Code generated … DO NOT EDIT` header (entgql writes ent.graphql from the
  # ent schemas, controlplane-api/ent/entc/entc.go). Headered generated files are recognised without configuration.
  review:
    generatedPaths: ["controlplane-api/ent.graphql"]
  moduleScope:
    graph: .github/ci/module-graph.json
    # ADR-0089: dependency manifests scope to their owning module (the graph supplies the transitive dependents), and the
    # graph is read from the base commit; only genuinely shared tooling/configuration forces full validation.
    sharedPaths: [Makefile, "hack/**", ".github/workflows/**", ".github/scripts/**", ".golangci.yml", ".ko.yaml", "go.work*"]
    # The derived graph is metadata, not shared tooling, and needs no module owner.
    nonBuildPaths: ["docs/**", ".github/ci/module-graph.json"]
  checks:                    # ADR-0061/ADR-0089: scoped checks follow the tier (readiness: changed modules;
                             # preparation/verification: changed + transitive dependents); only shared tooling or
                             # configuration changes run full validation. No check runs the whole monorepo.
    build: { command: make build-all, timeoutMs: 1800000, scoped: true }
    unit-tests: { command: make test-all, timeoutMs: 3600000, scoped: true }
    focused-tests: { command: make test-all, timeoutMs: 900000, scoped: true }
    # Deprecated aliases: kept scoped so in-flight plans that reference them still resolve, without ever running the
    # whole monorepo. The planner is told not to add them; remove them once no open plan references them.
    full-build: { command: make build-all, timeoutMs: 1800000, scoped: true }
    full-tests: { command: make test-all, timeoutMs: 3600000, scoped: true }
    preflight:                 # Same-environment prerequisites (ADR-0042 §X23c). `gotestsum` is declared on the go-build
                               # profile (ADR-0088) and provided by the factory on PATH, so this only prepares what the
                               # repository itself must build, and verifies the declared tool is really there.
      command: >-
        go version && command -v make && command -v gotestsum &&
        make -C rover controller-gen envtest &&
        rover/bin/setup-envtest use 1.32.0 --bin-dir rover/bin -p path
      timeoutMs: 900000
  verification:
    requiredChecks: [build, unit-tests, integration-tests, acceptance-criteria, security-scan]
    preflightChecks: [preflight]
    preparationChecks: [build]
    waivableChecks: [integration-tests, acceptance-criteria, security-scan]
    readinessChecks: [build, focused-tests]
