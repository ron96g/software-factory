apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-backend
  labels:
    factory.ai-dlc.io/language: go
spec:
  git:
    url: https://github.com/acme/shop-backend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true            # code search / embeddings for code-researcher
    refreshOn: [push]
    include: ["**/*.go", "**/*.md", "api/**/*.yaml"]
    exclude: ["vendor/**"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: shop-core }]
  observability:             # lets the SRE/code-researcher map runtime errors → code
    service: shop-backend
    logs: { provider: loki, selector: '{app="shop-backend"}' }
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: shop-frontend
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  git:
    url: https://github.com/acme/shop-frontend.git
    defaultBranch: main
    secretRef: { name: github-token }
  index:
    enabled: true
    refreshOn: [push]
    include: ["src/**"]
  context:
    docs: [README.md]
    owners: [{ role: tech-lead, team: shop-web }]
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Repository
metadata:
  name: software-factory
  labels:
    factory.ai-dlc.io/language: typescript
spec:
  local:
    path: .                  # relative to the factory root (MVP: local checkouts only, ADR-0008)
  git:                       # ADR-0023: branches are pushed here and draft PRs opened
    url: https://github.com/ron96g/software-factory.git
    defaultBranch: master
    secretRef: { name: github-token }
  index:
    enabled: true
    type: ripgrep
    include: ["web/src/**", "agents/**", "skills/**", "workflows/**", "docs/**", "*.md"]
  context:
    docs: [README.md, docs/architecture.md]
    owners: [{ role: tech-lead, team: platform }]
  sandboxRef: { name: node-build }
  checks:                    # ADR-0023: commands for the automated gate, run in the workspace
    build: cd web && npx tsc --noEmit -p .
    unit-tests: cd web && npm test --silent
  workspace:                 # ADR-0021: runs once in a fresh workspace (host: git worktree)
    setup:
      - cd web && npm ci --no-audit --no-fund --loglevel=error
