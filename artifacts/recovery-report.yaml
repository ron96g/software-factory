apiVersion: factory.ai-dlc.io/v1alpha1
kind: ArtifactType
metadata: { name: recovery-report }
spec:
  format: json
  description: Evidence and bounded recommendations from a technical recovery diagnosis (ADR-0059).
  schema:
    version: "1"
    jsonSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [schemaVersion, episode, trigger, failureSignature, facts, hypotheses, actions, obligations, evidence, recommendation]
      properties:
        schemaVersion: { const: "1" }
        episode: &text { type: string, minLength: 1, maxLength: 300, pattern: '\S' }
        trigger:
          type: object
          additionalProperties: false
          required: [kind, name, uid, resourceVersion]
          properties:
            kind: { enum: [AgentRun, CheckRun] }
            name: *text
            uid: *text
            resourceVersion: *text
        failureSignature: *text
        facts: &texts { type: array, maxItems: 40, items: *text }
        hypotheses: *texts
        actions:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [action, result]
            properties:
              action: *text
              result: *text
        obligations: *texts
        evidence:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [kind, name, resourceVersion]
            properties:
              kind: { enum: [AgentRun, CheckRun, Artifact] }
              name: *text
              resourceVersion: *text
        codeEvidence:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [repository, path, startLine, endLine, snapshot]
            properties:
              repository: *text
              path: *text
              startLine: { type: integer, minimum: 1 }
              endLine: { type: integer, minimum: 1 }
              snapshot: *text
        recommendation: { enum: [diagnose, repair, execution-recovery, human-need, stop] }
        humanNeed:
          type: object
          additionalProperties: false
          required: [kind, runtime, need, options, recommendation]
          properties:
            kind: { const: sandbox-runtime }
            runtime: *text
            need: *text
            options:
              type: array
              minItems: 2
              maxItems: 2
              prefixItems: [{ const: Restore runtime }, { const: Stop }]
              items: false
            recommendation: { const: Restore runtime }
      allOf:
        - if:
            properties: { recommendation: { const: human-need } }
            required: [recommendation]
          then: { properties: { humanNeed: {} }, required: [humanNeed] }
          else: { not: { properties: { humanNeed: {} }, required: [humanNeed] } }
