# ADR-0019: runtime-neutral sandbox profiles. Adapters (podman, kubernetes, remote, …) translate them.
apiVersion: factory.ai-dlc.io/v1alpha1
kind: SandboxProfile
metadata:
  name: node-build
spec:
  image: docker.io/library/node:22-bookworm
  resources: { cpu: "2", memory: 4Gi, pids: 512, timeout: 30m }
  network:
    mode: allowlist
    allow: [registry.npmjs.org, github.com]
  filesystem: { workspace: /workspace, rootReadOnly: true, tmpfs: [/tmp] }
  user: "1000:1000"
  isolation: container
  # ADR-0080 §11: local `bwrap` provides `process`; the reviewed profile accepts it (a cluster satisfies `container`).
  acceptWeakerIsolation: true
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: SandboxProfile
metadata:
  name: go-build
spec:
  image: docker.io/library/golang:1.26-bookworm
  resources: { cpu: "4", memory: 8Gi, pids: 1024, timeout: 60m }
  env:                       # ADR-0033: plain values for every command (never secrets)
    GOPROXY: https://proxy.golang.org,direct
    # The declared image pins Go 1.26, but the local `bwrap` runtime executes the *host* Go (ADR-0080 §11). Generated
    # files embed a flate-compressed OpenAPI spec whose bytes differ between Go minor versions, so `go generate` on a
    # newer host rewrites them even when the spec is unchanged. Pin the exact toolchain the repository builds with
    # (its `go` directive) so generation is reproducible. Keep this in step with the repository's Go version.
    GOTOOLCHAIN: go1.26.11
  tools:                     # ADR-0088: the factory provides these into its toolchain cache (on PATH, persistent), so no
                             # check has to know how to install them or how to put them on PATH.
    - name: gotestsum
      provides: bin/gotestsum
      via: { type: goInstall, with: { module: gotest.tools/gotestsum@v1.13.0 } }
    # ADR-0092: controlplane's pre-commit `audit-gate` hook runs codespell during the publication commit. uv links the
    # tool absolutely (/factory-tools/…); the relative link keeps `provides` resolvable from the factory side.
    - name: codespell
      provides: bin/codespell
      via:
        type: command
        with:
          command: >-
            UV_TOOL_DIR=/factory-tools/uv-tools UV_TOOL_BIN_DIR=/factory-tools/bin uv tool install --quiet codespell==2.4.3
            && ln -sfn ../uv-tools/codespell/bin/codespell /factory-tools/bin/codespell
  network:
    mode: allowlist
    allow: [proxy.golang.org, sum.golang.org, storage.googleapis.com, github.com]
  filesystem: { workspace: /workspace, rootReadOnly: true, tmpfs: [/tmp] }
  user: "1000:1000"
  isolation: container
  # ADR-0080 §11: local `bwrap` provides `process`; the reviewed profile accepts it (a cluster satisfies `container`).
  acceptWeakerIsolation: true
