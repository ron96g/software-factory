# Agent/Skill carry their Markdown body inside spec.body (no frontmatter file).
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Agent
metadata:
  name: example-agent
  namespace: factory-system
spec:
  model:
    tier: standard
  body: |
    You are an example agent. Answer concisely.
---
# Secrets are only referenced by name; the value lives in the configured secret namespace.
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: example-provider
  namespace: factory-system
spec:
  secretRef:
    name: anthropic-api-key
