apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.factory.ai-dlc.io
spec:
  group: factory.ai-dlc.io
  scope: Namespaced
  names:
    kind: Workflow
    plural: workflows
    singular: workflow
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                recovery:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                planning:
                  type: object
                  properties:
                    reviewStage:
                      type: string
                      minLength: 1
                    planFormat:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    plannerStage:
                      type: string
                      minLength: 1
                    revisionStage:
                      type: string
                      minLength: 1
                    synthesisStage:
                      type: string
                      minLength: 1
                  required:
                    - reviewStage
                  x-kubernetes-validations:
                    - rule: has(self.plannerStage) != (has(self.revisionStage) ||
                        has(self.synthesisStage))
                      message: set plannerStage, or revisionStage together with synthesisStage
                    - rule: has(self.revisionStage) == has(self.synthesisStage)
                      message: revisionStage and synthesisStage go together
                verification:
                  type: object
                  properties:
                    planningStage:
                      type: string
                      minLength: 1
                    reviewStage:
                      type: string
                      minLength: 1
                    preflightStage:
                      type: string
                      minLength: 1
                    verifyStage:
                      type: string
                      minLength: 1
                    implementationStage:
                      type: string
                      minLength: 1
                    preparationStage:
                      type: string
                      minLength: 1
                    maxCodeAttempts:
                      type: integer
                      minimum: 1
                    maxExecutionAttempts:
                      type: integer
                      minimum: 1
                    retryDelayMs:
                      type: integer
                      minimum: 0
                  required:
                    - planningStage
                    - reviewStage
                    - preflightStage
                    - verifyStage
                    - implementationStage
                    - maxCodeAttempts
                    - maxExecutionAttempts
                    - retryDelayMs
                unitExecution:
                  type: object
                  properties:
                    barrierStage:
                      type: string
                      minLength: 1
                    maxCodeAttempts:
                      type: integer
                      minimum: 1
                    maxExecutionAttempts:
                      type: integer
                      minimum: 1
                  required:
                    - barrierStage
                    - maxCodeAttempts
                    - maxExecutionAttempts
                timebox:
                  type: string
                  minLength: 1
                trigger:
                  type: object
                  properties:
                    sourceRefs:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                          namespace:
                            type: string
                            minLength: 1
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        required:
                          - name
                phases:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                      stages:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              minLength: 1
                            mode:
                              type: string
                              minLength: 1
                            loop:
                              type: object
                              properties:
                                when:
                                  type: object
                                  properties:
                                    outcome:
                                      type: string
                                      minLength: 1
                                  required:
                                    - outcome
                                goto:
                                  type: string
                                  minLength: 1
                                maxAttempts:
                                  type: integer
                                  minimum: 1
                              required:
                                - when
                                - goto
                                - maxAttempts
                            publish:
                              type: object
                              properties:
                                pullRequest:
                                  type: object
                                  properties:
                                    draft:
                                      type: boolean
                                    onConflict:
                                      type: object
                                      properties:
                                        next:
                                          type: string
                                          minLength: 1
                                        maxAttempts:
                                          type: integer
                                          minimum: 1
                                      required:
                                        - next
                            steps:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                  agentRef:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                        minLength: 1
                                      namespace:
                                        type: string
                                        minLength: 1
                                        maxLength: 63
                                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                    required:
                                      - name
                                  skillRefs:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                          minLength: 1
                                        namespace:
                                          type: string
                                          minLength: 1
                                          maxLength: 63
                                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                      required:
                                        - name
                                  tools:
                                    type: array
                                    items:
                                      type: string
                                  outcomes:
                                    type: array
                                    items:
                                      type: string
                                      minLength: 1
                                  model:
                                    type: object
                                    properties:
                                      tier:
                                        type: string
                                        minLength: 1
                                  inputs:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        artifactRef:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              minLength: 1
                                            namespace:
                                              type: string
                                              minLength: 1
                                              maxLength: 63
                                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                          required:
                                            - name
                                      required:
                                        - artifactRef
                                  outputs:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        artifactRef:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              minLength: 1
                                            namespace:
                                              type: string
                                              minLength: 1
                                              maxLength: 63
                                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                          required:
                                            - name
                                      required:
                                        - artifactRef
                                required:
                                  - name
                                  - agentRef
                            gate:
                              type: object
                              properties:
                                type:
                                  type: string
                                  minLength: 1
                                routes:
                                  type: object
                                  additionalProperties:
                                    type: object
                                    properties:
                                      next:
                                        type: string
                                        minLength: 1
                                      block:
                                        type: string
                                        minLength: 1
                                      end:
                                        type: string
                                        minLength: 1
                                    x-kubernetes-validations:
                                      - rule: "[has(self.next), has(self.block), has(self.end)].filter(x, x).size() ==
                                          1"
                                        message: exactly one of next, block, end must be set
                                approvers:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      role:
                                        type: string
                                        minLength: 1
                                    required:
                                      - role
                                criteria:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                checks:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                onReject:
                                  type: object
                                  properties:
                                    next:
                                      type: string
                                      minLength: 1
                                    block:
                                      type: string
                                      minLength: 1
                                    end:
                                      type: string
                                      minLength: 1
                                  x-kubernetes-validations:
                                    - rule: "[has(self.next), has(self.block), has(self.end)].filter(x, x).size() ==
                                        1"
                                      message: exactly one of next, block, end must be set
                                onFailure:
                                  type: object
                                  x-kubernetes-preserve-unknown-fields: true
                                publication:
                                  type: object
                                  properties:
                                    artifactRef:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                          minLength: 1
                                        namespace:
                                          type: string
                                          minLength: 1
                                          maxLength: 63
                                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                      required:
                                        - name
                                    reviewStage:
                                      type: string
                                      minLength: 1
                                  required:
                                    - artifactRef
                                    - reviewStage
                              required:
                                - type
                              x-kubernetes-validations:
                                - rule: self.type != 'human-approval' || (has(self.approvers) &&
                                    self.approvers.size() > 0)
                                  message: a human-approval gate needs at least one approver
                            workflowRef:
                              type: object
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                namespace:
                                  type: string
                                  minLength: 1
                                  maxLength: 63
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              required:
                                - name
                            forEach:
                              type: object
                              properties:
                                artifactRef:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      minLength: 1
                                    namespace:
                                      type: string
                                      minLength: 1
                                      maxLength: 63
                                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                  required:
                                    - name
                                as:
                                  type: string
                                  minLength: 1
                                parallelism:
                                  type: integer
                                  minimum: 1
                              required:
                                - artifactRef
                                - as
                          required:
                            - name
                    required:
                      - name
                      - stages
                  minItems: 1
                humanInput:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                loop:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - phases
              x-kubernetes-validations:
                - rule: "!has(self.unitExecution) || has(self.verification)"
                  message: unitExecution requires verification
---
