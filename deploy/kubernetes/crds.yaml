                        name:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      required:
                        - name
                skillRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                      namespace:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
