# ADR-0014: agents declare a tier; providers map tiers to models.
# A provider is used only if its secret resolves (env var, ADR-0015), e.g. OPENAI_API_KEY.
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: openai
spec:
  type: openai-compatible
  baseUrl: https://api.openai.com/v1
  secretRef: { name: openai-api-key }
  default: true
  models:
    reasoning: gpt-5.1
    coding: gpt-5.1
    fast: gpt-5.1-mini
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: anthropic
spec:
  type: anthropic
  baseUrl: https://api.anthropic.com
  secretRef: { name: anthropic-api-key }
  models:
    reasoning: claude-opus-4-5
    coding: claude-sonnet-4-5
    fast: claude-haiku-4-5
