# ADR-0014: agents declare a tier; providers map tiers to models.
# A provider is used only if its secret resolves (env var, ADR-0015), e.g. OPENAI_API_KEY.
# Defaults are preferred; among them the first one whose secret resolves wins.
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: openai
spec:
  type: openai-compatible
  baseUrl: https://api.openai.com/v1
  secretRef: { name: openai-api-key }
  models:
    reasoning: gpt-5.1
    coding: gpt-5.1
    fast: gpt-5.1-mini
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: anthropic
spec:
  type: anthropic
  baseUrl: https://api.anthropic.com
  secretRef: { name: anthropic-api-key }
  models:
    reasoning: claude-opus-4-5
    coding: claude-sonnet-4-5
    fast: claude-haiku-4-5
---
# GitHub Copilot speaks the OpenAI chat API. Token: a GitHub token with Copilot access, e.g. COPILOT_TOKEN=$(gh auth token).
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: github-copilot
spec:
  type: openai-compatible
  baseUrl: https://api.githubcopilot.com
  secretRef: { name: copilot-token }
  models:
    reasoning: claude-opus-5.5
    coding: claude-opus-5.5
    fast: claude-haiku-5.5
  # ADR-0028: optional per-agent models (override the tier for that agent only), e.g.
  # agentModels:
  #   developer: gpt-5.1
  #   reviewer: gemini-3.8-pro
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: google
spec:
  type: google
  baseUrl: https://generativelanguage.googleapis.com/v1beta
  secretRef: { name: google-api-key }
  default: true
  models:
    reasoning: gemini-4-neon
    coding: gemini-4-neon
    fast: gemini-3.8-flash
---
# OpenRouter: one key for many vendors through an OpenAI-compatible endpoint. Model IDs are `vendor/model`
# (https://openrouter.ai/models); any model the catalogue offers can be mapped to a tier or to a single agent (ADR-0028).
apiVersion: factory.ai-dlc.io/v1alpha1
kind: ModelProvider
metadata:
  name: openrouter
spec:
  type: openai-compatible
  baseUrl: https://openrouter.ai/api/v1
  secretRef: { name: openrouter-api-key }   # OPENROUTER_API_KEY
  models:
    reasoning: anthropic/claude-opus-5.5
    coding: anthropic/claude-sonnet-5.5
    fast: google/gemini-3.8-flash
  # Broker default is off: set `default: true` to prefer this provider over the others when several keys resolve.
  # ADR-0028: optional per-agent models, e.g.
  # agentModels:
  #   reviewer: openai/gpt-6.2-astra-pro
