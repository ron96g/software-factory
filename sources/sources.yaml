apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: github-issues
spec:
  type: github
  connection:
    repo: ron96g/software-factory
    secretRef: { name: github-token }
  sync:
    mode: webhook            # webhook | poll
    pollInterval: 5m
    filter: { labels: [factory] }
    bidirectional: true      # post clarification questions/status back as comments
  mapping:
    title: title
    description: body
    externalId: number
    labels: labels[*].name
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: jira-main
spec:
  type: jira
  connection:
    url: https://jira.telekom.de
    deployment: datacenter        # cloud (REST v3, email + API token) | datacenter (REST v2, Personal Access Token)
    secretRef: { name: jira-token }   # PAT from JIRA_TOKEN (ADR-0015)
  sync:
    mode: poll
    pollInterval: 5m
    # Only your own labelled issues: the factory comments on imported issues (bidirectional).
    filter: { jql: "labels = factory AND reporter = currentUser() AND statusCategory != Done ORDER BY updated DESC" }
    bidirectional: true
  mapping:
    title: fields.summary
    description: fields.description
    externalId: key
    priority: fields.priority.name
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: jira-servicedesk
spec:
  type: jira
  connection:
    url: https://jira.telekom.de
    deployment: datacenter
    secretRef: { name: jira-token }
  sync:
    mode: poll
    pollInterval: 5m
    filter: { jql: "project = SDDHEI AND labels = factory AND statusCategory != Done ORDER BY updated DESC" }
    # Read-only: customers would see the factory's comments. Enforced by the outbox and the Jira connector.
    bidirectional: false
  mapping:
    title: fields.summary
    description: fields.description
    externalId: key
    priority: fields.priority.name
  defaults:
    workflowRef: { name: servicedesk }
    repositoryRefs:
      - name: controlplane
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: manual
spec:
  type: manual               # items created via the dashboard form
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: monitoring-feedback
spec:
  type: internal             # signals emitted by the monitor stage (closes the loop)
  defaults:
    workflowRef: { name: factory-loop }
