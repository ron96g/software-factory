apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: github-issues
spec:
  type: github
  connection:
    repo: ron96g/software-factory
    secretRef: { name: github-token }
  sync:
    mode: webhook            # webhook | poll
    pollInterval: 5m
    filter: { labels: [factory] }
    bidirectional: true      # post clarification questions/status back as comments
  mapping:
    title: title
    description: body
    externalId: number
    labels: labels[*].name
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: jira-main
spec:
  type: jira
  connection:
    url: https://acme.atlassian.net
    project: SHOP
    email: factory-bot@acme.com   # basic auth user; token from JIRA_TOKEN (ADR-0015)
    secretRef: { name: jira-token }
  sync:
    mode: poll
    pollInterval: 5m
    filter: { jql: "project = SHOP AND labels = factory" }
    bidirectional: true
  mapping:
    title: fields.summary
    description: fields.description
    externalId: key
    priority: fields.priority.name
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: shop-backend
      - name: shop-frontend
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: manual
spec:
  type: manual               # items created via the dashboard form
  defaults:
    workflowRef: { name: factory-loop }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: monitoring-feedback
spec:
  type: internal             # signals emitted by the monitor stage (closes the loop)
  defaults:
    workflowRef: { name: factory-loop }
