apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: github-issues
spec:
  type: github
  connection:
    repo: ron96g/software-factory
    secretRef: { name: github-token }
  sync:
    mode: webhook            # webhook | poll
    pollInterval: 5m
    filter: { labels: [factory] }
    bidirectional: true      # post clarification questions/status back as comments
  mapping:
    title: title
    description: body
    externalId: number
    labels: labels[*].name
  defaults:
    workflowRef: { name: factory-plan }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: jira-main
spec:
  type: jira
  connection:
    url: https://jira.telekom.de
    deployment: datacenter        # cloud (REST v3, email + API token) | datacenter (REST v2, Personal Access Token)
    secretRef: { name: jira-token }   # PAT from JIRA_TOKEN (ADR-0015)
  sync:
    mode: poll
    pollInterval: 5m
    # Only your own labelled issues: the factory comments on imported issues (bidirectional).
    filter: { jql: "labels = factory AND reporter = currentUser() AND statusCategory != Done ORDER BY updated DESC" }
    bidirectional: true
  writeBack:
    issues:                                      # ADR-0066: permits creating issues; the key lives only here
      project: DHEI
      linkOrigin: false                          # ADR-0068: link new tickets to the origin ticket (Jira, same instance)
      issueType: Task
      fields:
        customfield_18514: "11341"               # Team: "DHEI - Hyperion"
        fixVersions: [{ name: Q4/2026 }]         # required for DHEI Tasks
  mapping:
    title: fields.summary
    description: fields.description
    externalId: key
    priority: fields.priority.name
  defaults:
    workflowRef: { name: factory-plan }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: jira-servicedesk
spec:
  type: jira
  connection:
    url: https://jira.telekom.de
    deployment: datacenter
    secretRef: { name: jira-token }
  sync:
    mode: poll
    pollInterval: 5m
    filter: { jql: "project = SDDHEI AND labels = factory AND statusCategory != Done ORDER BY updated DESC" }
    # No automatic clarification posting or inbound comment-answer sync. Comments and history are still imported
    # read-only as context for agents (ADR-0070).
    bidirectional: false
  writeBack:
    replyVisibilities: [public, internal]  # only after explicit human publication review
    transitions: true                    # only live Jira transitions confirmed by a human
  mapping:
    title: fields.summary
    description: fields.description
    externalId: key
    priority: fields.priority.name
  defaults:
    workflowRef: { name: servicedesk }
    repositoryRefs:
      - name: controlplane
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: manual
spec:
  type: manual               # items created via the dashboard form
  defaults:
    workflowRef: { name: factory-plan }
    repositoryRefs:
      - name: software-factory
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: monitoring-feedback
spec:
  type: internal             # signals emitted by the monitor stage (closes the loop)
  defaults:
    workflowRef: { name: factory-plan }
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: github-pull-requests
spec:
  type: github-pr                # ADR-0094: open pull requests, pinned at their head
  connection:
    repo: ron96g/software-factory
    secretRef: { name: github-token }
  sync:
    mode: poll
    pollInterval: 5m
    filter: { labels: [factory-review] }
    bidirectional: false         # no automatic comments; only the human-approved review is posted
  writeBack:
    pullRequestReviews: [comment, approve, request-changes]
  mapping:
    title: title
    description: body
    externalId: number
  defaults:
    workflowRef: { name: pr-review }
    repositoryRefs:
      - name: software-factory   # exactly the pull request's repository
---
apiVersion: factory.ai-dlc.io/v1alpha1
kind: Source
metadata:
  name: controlplane-pull-requests
spec:
  type: github-pr                # ADR-0094: open pull requests of telekom/controlplane, pinned at their head
  connection:
    repo: telekom/controlplane
    secretRef: { name: github-token }
  sync:
    mode: poll
    pollInterval: 5m
    filter: { labels: [factory-review] }
    bidirectional: false         # no automatic comments; only the human-approved review is posted
  writeBack:
    pullRequestReviews: [comment] # public repository: start with comments only; add approve/request-changes deliberately
  mapping:
    title: title
    description: body
    externalId: number
  defaults:
    workflowRef: { name: pr-review }
    repositoryRefs:
      - name: controlplane
